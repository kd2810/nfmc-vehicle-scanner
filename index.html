
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>NFMC Guardhouse Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 22px 14px;
      background: #eef5fc;
      font-family: Arial, sans-serif;
      color: #173553;
    }

    .card {
      max-width: 460px;
      margin: auto;
      background: white;
      padding: 25px 18px;
      border-radius: 20px;
      box-shadow: 0 6px 25px #17355315;
      text-align: center;
    }

    h2 { margin-bottom: 6px; }

    .subtitle {
      color: #667b90;
      font-size: 13px;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 17px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #185aa7;
      color: white;
      margin-top: 10px;
    }

    button:disabled {
      opacity: .55;
      cursor: default;
    }

    #result {
      display: none;
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .success {
      background: #e1f6e9;
      color: #146d39;
    }

    .warning {
      background: #fff1d7;
      color: #885400;
    }

    .error {
      background: #ffe8e8;
      color: #a12b2b;
    }

    .status {
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .details {
      font-size: 14px;
      line-height: 1.8;
    }

    #message {
      margin-top: 15px;
      font-size: 13px;
      color: #61758a;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>NFMC GUARDHOUSE</h2>
    <div class="subtitle">LIVE VEHICLE QR SCANNER</div>

    <div id="reader"></div>

    <button id="startBtn" onclick="startScanner()">
      START SCANNING
    </button>

    <button id="nextBtn"
            onclick="startScanner()"
            style="display:none">
      SCAN NEXT VEHICLE
    </button>

    <div id="message">
      Tap START SCANNING to open camera.
    </div>

    <div id="result"></div>
  </div>

  <script>
    const API_URL =
      'https://nfmc-vehicle-api.korinesmnth.workers.dev/scan';

    let scanner = null;
    let busy = false;

    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');
    const message = document.getElementById('message');
    const result = document.getElementById('result');

    function showResult(type, title, details) {
      result.className = type;
      result.style.display = 'block';
      result.innerHTML =
        '<div class="status"></div>' +
        '<div class="details"></div>';

      result.querySelector('.status').textContent = title;
      result.querySelector('.details').textContent = details;
    }

    async function stopScanner() {
      if (!scanner) return;

      try {
        if (scanner.isScanning) {
          await scanner.stop();
        }

        scanner.clear();
      } catch (error) {
        console.error(error);
      }

      scanner = null;
    }

    async function startScanner() {
      if (busy) return;

      busy = true;
      startBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      result.style.display = 'none';
      message.textContent = 'Opening camera...';

      try {
        await stopScanner();

        if (typeof Html5Qrcode === 'undefined') {
          throw new Error('Scanner library did not load.');
        }

        scanner = new Html5Qrcode('reader');

        await scanner.start(
          { facingMode: 'environment' },
          {
            fps: 10,
            qrbox: function(w, h) {
              const size = Math.min(w, h, 260);
              return { width: size, height: size };
            }
          },
          onQrDetected,
          function() {}
        );

        message.textContent =
          'Point camera at vehicle QR code.';

        busy = false;

      } catch (error) {
        busy = false;
        await stopScanner();

        showResult(
          'error',
          'CAMERA ERROR',
          error.message || String(error)
        );

        message.textContent = 'Camera could not start.';
        startBtn.style.display = 'block';
      }
    }

    async function onQrDetected(qrText) {
      if (busy) return;
      busy = true;

      message.textContent =
        'Verifying QR and saving movement...';

      await stopScanner();

      try {
        const url = new URL(qrText);

        if (url.protocol !== 'https:' ||
            url.hostname !== 'script.google.com' ||
            !/^\/macros\/s\/[^/]+\/exec\/?$/.test(url.pathname)) {
          throw new Error('Invalid NFMC vehicle QR code.');
        }

        const id = url.searchParams.get('v');
        const key = url.searchParams.get('k');

        if (!id || !key) {
          throw new Error('QR code is missing vehicle data.');
        }

        const response = await fetch(API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ id, key })
        });

        const data = await response.json();

        if (data.duplicate) {
          showResult(
            'warning',
            'DUPLICATE SCAN',
            data.vehicle + ' | ' + data.plate +
            ' | Current status: ' + data.status +
            '. No new movement recorded.'
          );

        } else if (response.ok && data.success) {
          showResult(
            'success',
            data.status + ' RECORDED',
            data.vehicle + ' | ' + data.plate +
            ' | ' + data.time
          );

        } else {
          throw new Error(
            data.message || 'Recording failed.'
          );
        }

        message.textContent =
          'Ready for the next vehicle.';

      } catch (error) {
        showResult(
          'error',
          'SCAN FAILED',
          error.message || String(error)
        );

        message.textContent =
          'If recording is uncertain, check the log before rescanning.';
      }

      busy = false;
      nextBtn.style.display = 'block';
    }
  </script>
</body>
</html>
